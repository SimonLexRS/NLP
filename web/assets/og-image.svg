<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Vista previa social (og:image) · 1200x630 · identidad: ink #0b1220 + teal #0f766e -->
  <!-- Tipografías de marca con fallback: en CI el PNG se rasteriza con resvg
       (scripts/render-og-image.mjs); si la fuente no está, cae a DejaVu/Liberation. -->
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d9488" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#0b1220" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Fondo -->
  <rect width="1200" height="630" fill="#0b1220"/>
  <circle cx="1120" cy="620" r="420" fill="url(#glow)"/>

  <!-- Motivo del favicon: tarjeta con líneas de texto -->
  <g>
    <rect x="972" y="88" width="156" height="128" rx="28" fill="#0f766e"/>
    <rect x="990" y="112" width="120" height="9" rx="4.5" fill="#ffffff" opacity="0.92"/>
    <rect x="990" y="134" width="120" height="7" rx="3.5" fill="#ffffff" opacity="0.55"/>
    <rect x="990" y="156" width="120" height="7" rx="3.5" fill="#ffffff" opacity="0.55"/>
    <rect x="990" y="178" width="72" height="7" rx="3.5" fill="#ffffff" opacity="0.55"/>
  </g>

  <!-- Bloque de texto -->
  <rect x="72" y="164" width="64" height="6" rx="3" fill="#0d9488"/>
  <text x="72" y="236" font-family="'IBM Plex Mono', 'DejaVu Sans Mono', monospace" font-size="22" font-weight="500" letter-spacing="2" fill="#5eead4">NLP · PROCESAMIENTO DE LENGUAJE NATURAL · CASO 9</text>

  <text x="72" y="330" font-family="'Source Serif 4', 'DejaVu Serif', Georgia, serif" font-size="66" font-weight="700" fill="#ffffff">Clasificador de Noticias</text>

  <text x="72" y="398" font-family="'IBM Plex Sans', 'DejaVu Sans', sans-serif" font-size="30" font-weight="500" fill="#cbd5e1">Pipeline NLP: categoría · tono · sentimiento</text>
  <text x="72" y="442" font-family="'IBM Plex Sans', 'DejaVu Sans', sans-serif" font-size="30" font-weight="500" fill="#cbd5e1">100 % en el navegador, sin backend</text>

  <rect x="72" y="512" width="1056" height="1.5" fill="#1e293b"/>
  <text x="72" y="558" font-family="'IBM Plex Sans', 'DejaVu Sans', sans-serif" font-size="24" font-weight="400" fill="#94a3b8">Universidad Católica Boliviana «San Pablo» · 2026</text>
</svg>