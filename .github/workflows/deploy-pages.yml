name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - "web/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Vista previa social: el PNG (og:image) se genera desde og-image.svg en
      # cada deploy para no versionar binarios. Las redes sociales no soportan
      # SVG como og:image, así que og-image.png debe existir en el artefacto.
      - name: Instalar tipografías de marca (TTF)
        run: |
          for pkg in @expo-google-fonts/ibm-plex-sans @expo-google-fonts/ibm-plex-mono @expo-google-fonts/source-serif-4; do
            npm install --no-save --no-package-lock "$pkg" || echo "Sin $pkg: se usan fuentes del sistema"
          done

      - name: Renderizar og:image (1200x630)
        run: |
          npm install --no-save --no-package-lock @resvg/resvg-js
          node scripts/render-og-image.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "web"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
